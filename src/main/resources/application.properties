spring.application.name=ventas
server.port=9002

spring.datasource.url=${VENTAS_DB_URL:jdbc:postgresql://localhost:5432/ventas_db}
spring.datasource.username=${VENTAS_DB_USER:ventas_app}
spring.datasource.password=${VENTAS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

servicios.catalogo.url=${CATALOGO_URL:http://localhost:9001}
servicios.clientes.url=${CLIENTES_URL:http://localhost:9003}
servicios.timeout-ms=5000
servicios.clientes.soap-url=${CLIENTES_SOAP_URL:http://localhost:9003/ws}